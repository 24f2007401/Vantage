apiVersion: apps/v1
kind: Deployment
metadata:
  name: vantage-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vantage-app
  template:
    metadata:
      labels:
        app: vantage-app
    spec:
      containers:
      - name: vantage-app
        image: vantage-app:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: vantage-service
spec:
  type: NodePort
  selector:
    app: vantage-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30007
