<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Drive Details | Vantage OS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = { darkMode: "class", theme: { extend: {
  "colors": { "tertiary":"#7e2e00","on-primary":"#ffffff","background":"#f9f9fe","surface-container-lowest":"#ffffff","surface":"#f9f9fe","on-surface-variant":"#424753","secondary":"#4b5e87","surface-container-highest":"#e2e2e7","primary-container":"#005bc2","surface-container":"#ededf2","primary":"#004495","outline-variant":"#c2c6d5","outline":"#727784","secondary-container":"#bbcffd","on-surface":"#1a1c1f","error":"#ba1a1a","surface-container-high":"#e8e8ed","surface-container-low":"#f3f3f8","primary-fixed":"#d8e2ff","tertiary-fixed":"#ffdbcd","on-tertiary-fixed-variant":"#7d2d00","on-primary-container":"#cad9ff","secondary-fixed":"#d8e2ff" },
  "borderRadius": { "DEFAULT":"0.25rem","lg":"18px","xl":"24px","full":"9999px" },
  "fontFamily": { "headline":["Plus Jakarta Sans"],"body":["Inter"],"label":["Inter"],"mono":["JetBrains Mono"] }
}}}
</script>
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="bg-background font-body text-on-surface antialiased">
<!-- Top Nav -->
<nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-xl flex justify-between items-center h-14 px-6 shadow-[0_8px_32px_0_rgba(26,28,31,0.04)]">
<div class="flex items-center gap-4">
  <a href="/student" class="text-xl font-bold bg-gradient-to-br from-blue-700 to-blue-500 bg-clip-text text-transparent font-headline tracking-tight">Vantage OS</a>
  <span class="text-on-surface-variant text-sm font-medium">/ <a href="/student/drives" class="hover:text-primary">Drives</a> / Details</span>
</div>
<div class="flex items-center gap-4">
  <button id="logout-btn" class="p-2 text-slate-500 hover:bg-slate-100/50 transition-colors rounded-full">
    <span class="material-symbols-outlined">logout</span>
  </button>
</div>
</nav>

<main class="max-w-4xl mx-auto pt-20 px-6 pb-12">
  <!-- Back button -->
  <a href="/student/drives" class="inline-flex items-center gap-2 text-primary font-semibold mb-6 hover:underline">
    <span class="material-symbols-outlined text-base">arrow_back</span> Back to Drives
  </a>

  <!-- Drive Content -->
  <div id="drive-content">
    <div class="bg-surface-container-lowest p-8 rounded-2xl shadow-[0_8px_32px_0_rgba(26,28,31,0.04)] mb-6">
      <div class="flex items-start justify-between mb-4">
        <div>
          <h1 id="company-name" class="text-3xl font-extrabold font-headline tracking-tight mb-1">Loading...</h1>
          <p id="role-title" class="text-xl text-on-surface-variant font-medium"></p>
        </div>
        <span id="ctc-badge" class="text-lg font-mono font-bold text-primary bg-primary-fixed/20 px-4 py-2 rounded-full"></span>
      </div>
      <div class="flex flex-wrap gap-4 text-sm text-on-surface-variant mb-6">
        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">location_on</span> <span id="location">—</span></span>
        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">schedule</span> <span id="deadline">—</span></span>
        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">work</span> <span id="job-type">—</span></span>
      </div>
      <div id="branches-chips" class="flex flex-wrap gap-2 mb-6"></div>
    </div>

    <!-- Eligibility Panel -->
    <div id="eligibility-panel" class="p-6 rounded-2xl mb-6"></div>

    <!-- Description -->
    <div class="bg-surface-container-lowest p-8 rounded-2xl shadow-[0_8px_32px_0_rgba(26,28,31,0.04)] mb-8">
      <h2 class="font-headline font-bold text-xl mb-4">Job Description</h2>
      <div id="description" class="text-on-surface-variant leading-relaxed"></div>
    </div>

    <!-- Apply Button -->
    <button id="apply-btn" disabled class="w-full bg-gradient-to-br from-primary to-primary-container text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-lg disabled:opacity-50 disabled:cursor-not-allowed">
      Apply Now <span class="material-symbols-outlined">send</span>
    </button>
    <ul id="ineligible-reasons" class="mt-4 text-sm text-error space-y-1 hidden"></ul>
  </div>
</main>

<!-- Vantage API -->
<script src="/static/js/vantage-api.js"></script>
<script>
if (!requireAuth("student")) { /* redirected */ }
document.getElementById("logout-btn")?.addEventListener("click", doLogout);

const driveId = window.location.pathname.split("/").pop();

async function loadDriveDetail() {
    const data = await apiFetch(`/api/student/drives/${driveId}`);
    if (!data) {
        document.getElementById("drive-content").innerHTML =
            `<div class="text-center py-20"><p class="text-on-surface-variant text-lg mb-4">Drive not found or no longer available.</p><a href="/student/drives" class="text-primary font-semibold hover:underline">← Back to Drives</a></div>`;
        return;
    }

    document.getElementById("company-name").textContent = data.company_name || data.drive_title;
    document.getElementById("role-title").textContent = data.role_title;
    document.getElementById("ctc-badge").textContent = data.ctc_lpa ? `₹${data.ctc_lpa} LPA` : '';
    document.getElementById("location").textContent = data.job_location || 'TBD';
    document.getElementById("deadline").textContent = data.application_close_at ? `Apply by ${new Date(data.application_close_at).toLocaleDateString()}` : 'Open';
    document.getElementById("job-type").textContent = data.job_type || '';
    document.getElementById("description").textContent = data.description || 'No description provided.';

    // Eligibility
    const panel = document.getElementById("eligibility-panel");
    const applyBtn = document.getElementById("apply-btn");
    const reasons = document.getElementById("ineligible-reasons");
    
    if (data.eligibility && data.eligibility.is_eligible) {
        panel.className += " bg-green-50";
        panel.innerHTML = '<div class="flex items-center gap-3"><span class="material-symbols-outlined text-green-600">check_circle</span><p class="font-semibold text-green-700">You are eligible to apply for this drive</p></div>';
        applyBtn.disabled = false;
        applyBtn.addEventListener("click", async () => {
            applyBtn.disabled = true;
            applyBtn.innerHTML = 'Submitting… <span class="material-symbols-outlined animate-spin">progress_activity</span>';
            const res = await apiFetch(`/api/student/drives/${driveId}/apply`, { method: "POST" });
            if (res) {
                applyBtn.innerHTML = 'Applied ✓';
                applyBtn.className = applyBtn.className.replace('from-primary to-primary-container', 'from-green-500 to-green-600');
                showToast("Application submitted successfully!", "success");
            } else {
                applyBtn.disabled = false;
                applyBtn.innerHTML = 'Apply Now <span class="material-symbols-outlined">send</span>';
            }
        });
    } else if (data.eligibility) {
        panel.className += " bg-amber-50";
        panel.innerHTML = '<div class="flex items-start gap-3"><span class="material-symbols-outlined text-amber-600">warning</span><div><p class="font-semibold text-amber-700 mb-2">You are not eligible for this drive</p>' +
            (data.eligibility.reasons || []).map(r => `<p class="text-amber-600 text-sm">• ${r}</p>`).join('') +
            '</div></div>';
        applyBtn.disabled = true;
        applyBtn.title = (data.eligibility.reasons || []).join("; ");
    }

    if (data.has_applied) {
        applyBtn.disabled = true;
        applyBtn.innerHTML = 'Already Applied ✓';
        applyBtn.className = applyBtn.className.replace('from-primary to-primary-container', 'from-green-500 to-green-600');
    }
}

document.addEventListener("DOMContentLoaded", loadDriveDetail);
</script>
</body></html>
