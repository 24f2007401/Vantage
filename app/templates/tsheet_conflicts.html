<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>T-Sheet Conflict Resolution | Vantage OS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>tailwind.config={darkMode:"class",theme:{extend:{"colors":{"primary":"#004495","primary-container":"#005bc2","on-primary":"#ffffff","surface":"#f9f9fe","surface-container-lowest":"#ffffff","surface-container":"#ededf2","surface-container-low":"#f3f3f8","surface-container-high":"#e8e8ed","on-surface":"#1a1c1f","on-surface-variant":"#424753","outline":"#727784","outline-variant":"#c2c6d5","secondary":"#4b5e87","error":"#ba1a1a","primary-fixed":"#d8e2ff","tertiary":"#7e2e00","tertiary-fixed":"#ffdbcd","background":"#f9f9fe"},"fontFamily":{"headline":["Plus Jakarta Sans"],"body":["Inter"],"mono":["JetBrains Mono"]},"borderRadius":{"lg":"18px","xl":"24px"}}}}</script>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}</style>
</head>
<body class="bg-background font-body text-on-surface antialiased">
<nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-xl flex justify-between items-center h-14 px-6 shadow-[0_8px_32px_0_rgba(26,28,31,0.04)]">
<div class="flex items-center gap-4">
  <a href="/admin" class="text-xl font-bold bg-gradient-to-br from-blue-700 to-blue-500 bg-clip-text text-transparent font-headline">Vantage OS</a>
  <span class="text-on-surface-variant text-sm">/ <a href="/admin/tsheets" class="hover:text-primary">T-Sheets</a> / Conflict Resolution</span>
</div>
<button id="logout-btn" class="p-2 text-slate-500 hover:bg-slate-100/50 rounded-full"><span class="material-symbols-outlined">logout</span></button>
</nav>
<main class="max-w-4xl mx-auto pt-20 px-6 pb-12">
  <a href="/admin/tsheets" class="inline-flex items-center gap-2 text-primary font-semibold mb-6 hover:underline"><span class="material-symbols-outlined text-base">arrow_back</span> Back to T-Sheets</a>

  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-extrabold font-headline mb-1">Conflict Resolution</h1>
      <p class="text-on-surface-variant">Batch: <span id="batch-id" class="font-mono"></span></p>
    </div>
    <div class="flex items-center gap-4">
      <span id="conflict-count" class="bg-error/10 text-error font-bold px-4 py-2 rounded-full text-sm"></span>
      <button id="btn-commit" disabled class="px-6 py-3 bg-gradient-to-br from-primary to-primary-container text-white font-bold rounded-xl shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
        <span class="material-symbols-outlined text-base mr-1">check_circle</span> Commit Batch
      </button>
    </div>
  </div>

  <!-- Progress -->
  <div class="mb-8">
    <div class="flex justify-between text-sm text-on-surface-variant mb-2">
      <span id="progress-text">Resolving conflicts...</span>
      <span id="progress-pct"></span>
    </div>
    <div class="h-2 bg-surface-container-high rounded-full overflow-hidden">
      <div id="progress-bar" class="h-full bg-gradient-to-r from-primary to-primary-container rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
  </div>

  <!-- Conflicts List -->
  <div id="conflicts-list" class="space-y-4"></div>
</main>

<script src="/static/js/vantage-api.js?v=2"></script>
<script>
if (!requireAuth("admin")) {}
document.getElementById("logout-btn")?.addEventListener("click", doLogout);
const batchId = window.location.pathname.split("/").pop();
document.getElementById("batch-id").textContent = batchId;

let totalConflicts = 0;
let resolvedCount = 0;

async function loadConflicts() {
    const data = await apiFetch(`/api/admin/tsheets/batches/${batchId}/conflicts`);
    if (!data) return;
    const conflicts = data.conflicts || [];
    totalConflicts = conflicts.length;
    resolvedCount = 0;
    updateProgress();
    document.getElementById("conflict-count").textContent = `${totalConflicts} conflicts`;
    renderConflicts(conflicts);
}

function renderConflicts(conflicts) {
    const list = document.getElementById("conflicts-list");
    list.innerHTML = "";
    if (!conflicts.length) {
        list.innerHTML = '<div class="text-center py-12 text-on-surface-variant"><span class="material-symbols-outlined text-4xl mb-2 block">check_circle</span><p class="font-semibold">All conflicts resolved! You can now commit the batch.</p></div>';
        document.getElementById("btn-commit").disabled = false;
        return;
    }
    conflicts.forEach(c => {
        let detail = {};
        try { detail = JSON.parse(c.conflict_detail || '{}'); } catch (e) {}
        const dbVal = detail.db_val || {};
        const tsVal = detail.tsheet_val || {};
        const dbDisplay = dbVal.grade != null
            ? `Grade: ${dbVal.grade} / GP: ${dbVal.points ?? '—'} / Total: ${dbVal.total ?? '—'}`
            : c.raw_grade_letter || '—';
        const tsDisplay = tsVal.grade != null
            ? `Grade: ${tsVal.grade} / GP: ${tsVal.points ?? '—'} / Total: ${tsVal.total ?? '—'}`
            : c.raw_grade_letter || '—';
        const card = document.createElement("div");
        card.id = `conflict-${c.id}`;
        card.className = "bg-surface-container-lowest p-6 rounded-2xl shadow-sm";
        card.innerHTML = `
            <div class="flex items-center gap-3 mb-4">
                <span class="material-symbols-outlined text-error">warning</span>
                <strong class="font-mono">${c.raw_ht_no || '—'}</strong>
                <span class="text-on-surface-variant text-sm">· ${c.raw_subject_code || ''}</span>
                <span class="ml-auto bg-error/10 text-error text-xs font-bold px-3 py-1 rounded-full">GRADE_MISMATCH</span>
            </div>
            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="bg-surface-container-low p-4 rounded-xl text-center">
                    <label class="text-xs font-bold text-on-surface-variant uppercase mb-1 block">Current DB</label>
                    <span class="font-mono font-bold text-sm">${dbDisplay}</span>
                </div>
                <div class="flex items-center justify-center text-outline font-bold">vs</div>
                <div class="bg-primary-fixed/20 p-4 rounded-xl text-center">
                    <label class="text-xs font-bold text-on-surface-variant uppercase mb-1 block">T-Sheet</label>
                    <span class="font-mono font-bold text-sm text-primary">${tsDisplay}</span>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="resolveConflict('${c.id}', 'KEEP_DB')" class="flex-1 py-3 bg-surface-container-high text-on-surface font-semibold rounded-xl hover:bg-surface-container-highest transition-colors">Keep DB Value</button>
                <button onclick="resolveConflict('${c.id}', 'ACCEPT_TSHEET')" class="flex-1 py-3 bg-primary text-white font-semibold rounded-xl hover:opacity-90 transition-opacity">Use T-Sheet Value</button>
            </div>`;
        list.appendChild(card);
    });
}

async function resolveConflict(conflictId, action) {
    const res = await apiFetch(`/api/admin/tsheets/conflicts/${conflictId}/resolve`, {
        method: "POST", body: JSON.stringify({ action })
    });
    if (res) {
        document.getElementById(`conflict-${conflictId}`)?.remove();
        resolvedCount++;
        updateProgress();
        showToast(`Conflict resolved: ${action === 'KEEP_DB' ? 'kept DB value' : 'applied T-Sheet value'}`, "success");
        if (resolvedCount >= totalConflicts) {
            document.getElementById("btn-commit").disabled = false;
            document.getElementById("conflicts-list").innerHTML = '<div class="text-center py-12 text-on-surface-variant"><span class="material-symbols-outlined text-4xl mb-2 block text-green-500">check_circle</span><p class="font-semibold text-green-700">All conflicts resolved! You can now commit the batch.</p></div>';
        }
    }
}

function updateProgress() {
    const pct = totalConflicts > 0 ? Math.round((resolvedCount / totalConflicts) * 100) : 0;
    document.getElementById("progress-bar").style.width = pct + "%";
    document.getElementById("progress-pct").textContent = pct + "%";
    document.getElementById("progress-text").textContent = `${resolvedCount} of ${totalConflicts} resolved`;
}

document.getElementById("btn-commit").addEventListener("click", async () => {
    const btn = document.getElementById("btn-commit");
    btn.disabled = true;
    btn.textContent = "Committing...";
    const res = await apiFetch(`/api/admin/tsheets/batches/${batchId}/resolve-all`, { method: "POST", body: JSON.stringify({ action: "accept_new" }) });
    if (res) {
        showToast(`Batch committed. Records verified!`, "success");
        setTimeout(() => window.location.href = "/admin/tsheets", 2000);
    } else {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-base mr-1">check_circle</span> Commit Batch';
    }
});

document.addEventListener("DOMContentLoaded", loadConflicts);
</script>
</body></html>
