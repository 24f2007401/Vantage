<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vantage OS | Create Account</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<!-- Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary": "#7e2e00",
          "on-primary": "#ffffff",
          "on-tertiary-fixed-variant": "#7d2d00",
          "background": "#f9f9fe",
          "surface-container-lowest": "#ffffff",
          "surface": "#f9f9fe",
          "on-surface-variant": "#424753",
          "secondary": "#4b5e87",
          "surface-container-highest": "#e2e2e7",
          "inverse-surface": "#2e3034",
          "inverse-on-surface": "#f0f0f5",
          "inverse-primary": "#adc6ff",
          "tertiary-fixed": "#ffdbcd",
          "tertiary-container": "#a43f02",
          "on-primary-container": "#cad9ff",
          "on-tertiary-fixed": "#360f00",
          "on-secondary": "#ffffff",
          "surface-variant": "#e2e2e7",
          "on-error": "#ffffff",
          "on-tertiary-container": "#ffd0bd",
          "surface-container-high": "#e8e8ed",
          "primary-container": "#005bc2",
          "surface-container": "#ededf2",
          "primary": "#004495",
          "outline-variant": "#c2c6d5",
          "on-primary-fixed": "#001a41",
          "surface-tint": "#005bc1",
          "outline": "#727784",
          "secondary-container": "#bbcffd",
          "on-background": "#1a1c1f",
          "error": "#ba1a1a",
          "error-container": "#ffdad6",
          "on-secondary-fixed-variant": "#33466d",
          "surface-container-low": "#f3f3f8",
          "tertiary-fixed-dim": "#ffb596",
          "on-surface": "#1a1c1f",
          "surface-bright": "#f9f9fe",
          "on-error-container": "#93000a",
          "on-tertiary": "#ffffff",
          "primary-fixed": "#d8e2ff",
          "surface-dim": "#d9dade",
          "primary-fixed-dim": "#adc6ff",
          "secondary-fixed-dim": "#b3c6f5",
          "on-secondary-container": "#445880",
          "on-primary-fixed-variant": "#004494",
          "secondary-fixed": "#d8e2ff",
          "on-secondary-fixed": "#021a3f"
        },
        "borderRadius": {
          "DEFAULT": "0.25rem",
          "lg": "0.5rem",
          "xl": "0.75rem",
          "full": "9999px"
        },
        "fontFamily": {
          "headline": ["Plus Jakarta Sans"],
          "body": ["Inter"],
          "label": ["Inter"]
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .ios-segment-pill {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .field-group {
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden py-8">

<!-- Background radial glow -->
<div class="absolute inset-0 z-0 overflow-hidden">
  <div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full opacity-20 blur-[120px]"
       style="background: radial-gradient(circle, #004495 0%, transparent 70%);"></div>
  <div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] rounded-full opacity-10 blur-[120px]"
       style="background: radial-gradient(circle, #7e2e00 0%, transparent 70%);"></div>
</div>

<!-- Card -->
<main class="relative z-10 w-full max-w-[440px] p-4">
  <div class="bg-surface-container-lowest rounded-[24px] p-8 shadow-[0_8px_32px_0_rgba(26,28,31,0.06)] flex flex-col gap-7">

    <!-- Branding -->
    <header class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-primary rounded-xl mb-4">
        <span class="material-symbols-outlined text-on-primary text-2xl">grid_view</span>
      </div>
      <h1 class="text-3xl font-headline font-extrabold tracking-tight text-on-surface">Vantage OS</h1>
      <p class="text-on-surface-variant font-medium text-sm">Create your account to access the platform.</p>
    </header>

    <!-- Role Selector -->
    <div class="bg-surface-container-high p-1 rounded-xl relative flex items-center h-11">
      <div class="absolute h-9 w-[calc(50%-4px)] bg-surface-container-lowest rounded-[10px] shadow-sm ios-segment-pill left-1" id="role-pill"></div>
      <button class="relative z-10 flex-1 text-xs font-semibold text-on-surface text-center" onclick="selectRole('student', 0)">Student</button>
      <button class="relative z-10 flex-1 text-xs font-semibold text-on-surface-variant hover:text-on-surface transition-colors text-center" onclick="selectRole('recruiter', 1)">Recruiter</button>
    </div>

    <!-- Form -->
    <form class="flex flex-col gap-5" onsubmit="return false;">

      <!-- College Email (always visible) -->
      <div class="space-y-1.5">
        <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1" id="email-label">College Email</label>
        <input id="email-input"
               class="w-full bg-surface-container-high text-on-surface placeholder:text-outline border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all"
               placeholder="21261A0501@mgit.ac.in"
               type="email"/>
      </div>

      <!-- Roll Number (student only) -->
      <div class="space-y-1.5 field-group" id="roll-field">
        <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Roll Number</label>
        <input id="roll-input"
               class="w-full bg-surface-container-high text-on-surface placeholder:text-outline border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all"
               placeholder="21261A0501"
               type="text"
               autocomplete="off"
               style="text-transform:uppercase;"/>
        <p class="text-[11px] text-on-surface-variant ml-1">Must match records uploaded by admin via T-Sheet.</p>
      </div>

      <!-- Company Name (recruiter only) -->
      <div class="space-y-1.5 field-group hidden" id="company-field">
        <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Company Name</label>
        <input id="company-input"
               class="w-full bg-surface-container-high text-on-surface placeholder:text-outline border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all"
               placeholder="Acme Corp"
               type="text"/>
      </div>

      <!-- Password -->
      <div class="space-y-1.5">
        <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Password</label>
        <input id="password-input"
               class="w-full bg-surface-container-high text-on-surface placeholder:text-outline border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all"
               placeholder="Min. 8 characters"
               type="password"/>
      </div>

      <!-- Confirm Password -->
      <div class="space-y-1.5">
        <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Confirm Password</label>
        <input id="confirm-input"
               class="w-full bg-surface-container-high text-on-surface placeholder:text-outline border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all"
               placeholder="••••••••"
               type="password"/>
      </div>

      <!-- Error Message -->
      <div id="error-message" class="text-error text-sm font-medium text-center hidden"></div>

      <!-- Submit -->
      <button id="signup-btn"
              class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
              type="submit">
        Create Account
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </button>
    </form>

    <!-- Footer -->
    <footer class="flex flex-col items-center gap-3 border-t border-surface-container-high pt-5">
      <p class="text-xs text-on-surface-variant">Already have an account?</p>
      <a href="/login" class="text-sm font-semibold text-primary hover:text-primary-container transition-colors flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">login</span>
        Sign In
      </a>
      <div class="mt-2 flex gap-4">
        <span class="font-mono text-[10px] text-outline uppercase tracking-tighter">Build 4.2.0-Alpha</span>
        <span class="font-mono text-[10px] text-outline uppercase tracking-tighter">Status: Systems Active</span>
      </div>
    </footer>

  </div>

  <!-- Decorative circles -->
  <div class="mt-8 flex justify-center opacity-30">
    <div class="flex -space-x-3">
      <div class="w-8 h-8 rounded-full bg-surface-container-highest border-2 border-surface"></div>
      <div class="w-8 h-8 rounded-full bg-surface-container-high border-2 border-surface"></div>
      <div class="w-8 h-8 rounded-full bg-surface-container border-2 border-surface"></div>
    </div>
  </div>
</main>

<script src="/static/js/vantage-api.js"></script>
<script>
  // Redirect if already logged in
  if (authToken) {
    const rmap = { student: "/student", admin: "/admin", recruiter: "/recruiter" };
    window.location.href = rmap[authRole] || "/";
  }

  let selectedRole = "student";

  function selectRole(role, index) {
    selectedRole = role;
    const pill = document.getElementById("role-pill");
    const buttons = pill.parentElement.querySelectorAll("button");
    pill.style.transform = `translateX(${index * 100}%)`;
    buttons.forEach((btn, i) => {
      if (i === index) {
        btn.classList.remove("text-on-surface-variant");
        btn.classList.add("text-on-surface");
      } else {
        btn.classList.remove("text-on-surface");
        btn.classList.add("text-on-surface-variant");
      }
    });

    const rollField    = document.getElementById("roll-field");
    const companyField = document.getElementById("company-field");
    const emailLabel   = document.getElementById("email-label");
    const emailInput   = document.getElementById("email-input");

    if (role === "student") {
      rollField.classList.remove("hidden");
      companyField.classList.add("hidden");
      emailLabel.textContent = "College Email";
      emailInput.placeholder = "21261A0501@mgit.ac.in";
    } else {
      rollField.classList.add("hidden");
      companyField.classList.remove("hidden");
      emailLabel.textContent = "Work Email";
      emailInput.placeholder = "hr@company.com";
    }
  }

  document.getElementById("signup-btn").addEventListener("click", async () => {
    const btn    = document.getElementById("signup-btn");
    const errEl  = document.getElementById("error-message");
    errEl.classList.add("hidden");

    const email    = document.getElementById("email-input").value.trim().toLowerCase();
    const password = document.getElementById("password-input").value;
    const confirm  = document.getElementById("confirm-input").value;

    if (!email || !password) {
      errEl.textContent = "Email and password are required.";
      errEl.classList.remove("hidden");
      return;
    }
    if (password.length < 8) {
      errEl.textContent = "Password must be at least 8 characters.";
      errEl.classList.remove("hidden");
      return;
    }
    if (password !== confirm) {
      errEl.textContent = "Passwords do not match.";
      errEl.classList.remove("hidden");
      return;
    }

    const body = { email, password, role: selectedRole };

    if (selectedRole === "student") {
      const roll = document.getElementById("roll-input").value.trim().toUpperCase();
      if (!roll) {
        errEl.textContent = "Roll number is required.";
        errEl.classList.remove("hidden");
        return;
      }
      body.roll_number = roll;
    } else {
      const company = document.getElementById("company-input").value.trim();
      if (!company) {
        errEl.textContent = "Company name is required.";
        errEl.classList.remove("hidden");
        return;
      }
      body.company_name = company;
    }

    btn.disabled = true;
    btn.innerHTML = 'Creating account… <span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>';

    try {
      const data = await apiFetch("/api/auth/signup", {
        method: "POST",
        body: JSON.stringify(body)
      });

      btn.disabled = false;
      btn.innerHTML = 'Create Account <span class="material-symbols-outlined text-[18px]">arrow_forward</span>';

      if (!data) return; // apiFetch already showed toast

      setAuth(data.access_token, data.user.role, data.refresh_token, data.user);
      const redirectMap = { student: "/student", recruiter: "/recruiter" };
      window.location.href = redirectMap[data.user.role] || "/";
    } catch (e) {
      btn.disabled = false;
      btn.innerHTML = 'Create Account <span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
      errEl.textContent = e?.body?.error || "Signup failed. Please try again.";
      errEl.classList.remove("hidden");
    }
  });

  document.getElementById("confirm-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("signup-btn").click();
  });
</script>
</body>
</html>
