<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Drive Detail | Recruiter | Vantage OS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>tailwind.config={darkMode:"class",theme:{extend:{"colors":{"primary":"#004495","primary-container":"#005bc2","on-primary":"#ffffff","surface":"#f9f9fe","surface-container-lowest":"#ffffff","surface-container":"#ededf2","surface-container-low":"#f3f3f8","surface-container-high":"#e8e8ed","on-surface":"#1a1c1f","on-surface-variant":"#424753","outline":"#727784","secondary":"#4b5e87","secondary-container":"#bbcffd","primary-fixed":"#d8e2ff","error":"#ba1a1a","background":"#f9f9fe"},"fontFamily":{"headline":["Plus Jakarta Sans"],"body":["Inter"],"mono":["JetBrains Mono"]},"borderRadius":{"lg":"18px","xl":"24px"}}}}</script>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}</style>
</head>
<body class="bg-background font-body text-on-surface antialiased">
<nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-xl flex justify-between items-center h-14 px-6 shadow-[0_8px_32px_0_rgba(26,28,31,0.04)]">
<div class="flex items-center gap-4">
  <a href="/recruiter" class="text-xl font-bold bg-gradient-to-br from-blue-700 to-blue-500 bg-clip-text text-transparent font-headline">Vantage OS</a>
  <span class="text-on-surface-variant text-sm">/ <a href="/recruiter/drives" class="hover:text-primary">My Drives</a> / Detail</span>
</div>
<button id="logout-btn" class="p-2 text-slate-500 hover:bg-slate-100/50 rounded-full"><span class="material-symbols-outlined">logout</span></button>
</nav>
<main class="max-w-5xl mx-auto pt-20 px-6 pb-12">
  <a href="/recruiter/drives" class="inline-flex items-center gap-2 text-primary font-semibold mb-6 hover:underline"><span class="material-symbols-outlined text-base">arrow_back</span> Back to Drives</a>

  <!-- Drive Info -->
  <div class="bg-surface-container-lowest p-8 rounded-2xl shadow-sm mb-6">
    <div class="flex items-start justify-between mb-4">
      <div>
        <h1 id="drive-title" class="text-3xl font-extrabold font-headline mb-1">Loading...</h1>
        <p id="role-title" class="text-lg text-on-surface-variant"></p>
      </div>
      <div class="flex items-center gap-3">
        <span id="ctc-badge" class="font-mono font-bold text-primary bg-primary-fixed/20 px-4 py-2 rounded-full"></span>
        <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"></span>
      </div>
    </div>
    <div class="flex gap-4 text-sm text-on-surface-variant">
      <span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">location_on</span><span id="location">—</span></span>
      <span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">schedule</span><span id="deadline">—</span></span>
    </div>
  </div>

  <!-- Applicants -->
  <div class="bg-surface-container-lowest p-6 rounded-2xl shadow-sm mb-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-headline font-bold text-xl">Applicants</h2>
      <div class="flex gap-3">
        <button id="btn-shortlist-export" class="px-4 py-2 bg-secondary-container text-secondary rounded-xl text-sm font-semibold hover:opacity-90 inline-flex items-center gap-2"><span class="material-symbols-outlined text-base">download</span>Export Shortlist</button>
      </div>
    </div>
    <div id="applicants-list" class="space-y-3"></div>
  </div>
</main>
<script src="/static/js/vantage-api.js"></script>
<script>
if (!requireAuth("recruiter")) {}
document.getElementById("logout-btn")?.addEventListener("click", doLogout);
const driveId = window.location.pathname.split("/").pop();

const STATUS_COLORS = {
    APPLIED: 'bg-blue-100 text-blue-700',
    WRITTEN_TEST: 'bg-amber-100 text-amber-700',
    SHORTLISTED: 'bg-green-100 text-green-700',
    GROUP_DISCUSSION: 'bg-purple-100 text-purple-700',
    TECHNICAL_INTERVIEW: 'bg-indigo-100 text-indigo-700',
    HR_INTERVIEW: 'bg-teal-100 text-teal-700',
    SELECTED: 'bg-emerald-100 text-emerald-800',
    REJECTED: 'bg-red-100 text-red-600'
};

async function loadDrive() {
    const d = await apiFetch(`/api/recruiter/drives/${driveId}`);
    if (!d) { return; }
    document.getElementById("drive-title").textContent = d.drive_title;
    document.getElementById("role-title").textContent = d.role_title;
    document.getElementById("ctc-badge").textContent = d.ctc_lpa ? `₹${d.ctc_lpa} LPA` : '';
    document.getElementById("location").textContent = d.job_location || 'TBD';
    document.getElementById("deadline").textContent = d.application_close_at ? new Date(d.application_close_at).toLocaleDateString() : 'Open';
    const sb = document.getElementById("status-badge");
    const sc = { DRAFT:'bg-slate-100 text-slate-600', OPEN:'bg-green-100 text-green-700', CLOSED:'bg-red-100 text-red-600' };
    sb.className = `px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${sc[d.status]||''}`;
    sb.textContent = d.status;
    loadApplicants();
}

async function loadApplicants() {
    const data = await apiFetch(`/api/recruiter/drives/${driveId}/applicants`);
    const list = document.getElementById("applicants-list");
    list.innerHTML = '';
    if (!data || !data.length) {
        list.innerHTML = '<p class="text-center text-on-surface-variant py-8">No applicants yet.</p>';
        return;
    }
    data.forEach(a => {
        const c = a.candidate || {};
        const sc = STATUS_COLORS[a.status] || 'bg-slate-100 text-slate-600';
        const card = document.createElement("div");
        card.className = "flex items-center justify-between p-4 bg-surface-container-low rounded-xl";
        card.innerHTML = `
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-primary-fixed/20 flex items-center justify-center"><span class="material-symbols-outlined text-primary text-lg">person</span></div>
                <div>
                    <p class="font-semibold">${c.full_name||c.roll_number||'—'}</p>
                    <p class="text-sm text-on-surface-variant">${c.branch||''} · CGPA ${c.cgpa||'—'} · Backlogs ${c.backlogs||0}</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <select data-app-id="${a.application_id}" class="status-select bg-surface-container-high rounded-xl px-3 py-2 text-xs border-none font-semibold">
                    ${['APPLIED','WRITTEN_TEST','SHORTLISTED','GROUP_DISCUSSION','TECHNICAL_INTERVIEW','HR_INTERVIEW','SELECTED','REJECTED'].map(s =>
                        `<option value="${s}" ${s===a.status?'selected':''}>${s.replace(/_/g,' ')}</option>`
                    ).join('')}
                </select>
            </div>`;
        list.appendChild(card);
    });

    document.querySelectorAll(".status-select").forEach(sel => {
        sel.addEventListener("change", async e => {
            const appId = e.target.dataset.appId;
            const res = await apiFetch(`/api/recruiter/applications/${appId}/status`, {
                method: "PATCH", body: JSON.stringify({ status: e.target.value })
            });
            if (res) showToast("Status updated.", "success");
        });
    });
}

document.getElementById("btn-shortlist-export").addEventListener("click", async () => {
    // Use apiFetch so JWT is included; then trigger download from the blob
    const token = sessionStorage.getItem("vantage_token");
    const res = await fetch(`/api/recruiter/drives/${driveId}/shortlist/export`, {
        headers: token ? { "Authorization": `Bearer ${token}` } : {}
    });
    if (!res.ok) { showToast("Export failed — check your permissions.", "error"); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `shortlist_${driveId}.csv`;
    a.click();
    URL.revokeObjectURL(url);
});

document.addEventListener("DOMContentLoaded", loadDrive);
</script>
</body></html>
