<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Drive Detail | Admin | Vantage OS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>tailwind.config={darkMode:"class",theme:{extend:{"colors":{"primary":"#004495","primary-container":"#005bc2","on-primary":"#ffffff","surface":"#f9f9fe","surface-container-lowest":"#ffffff","surface-container":"#ededf2","surface-container-low":"#f3f3f8","surface-container-high":"#e8e8ed","on-surface":"#1a1c1f","on-surface-variant":"#424753","outline":"#727784","outline-variant":"#c2c6d5","secondary":"#4b5e87","secondary-container":"#bbcffd","primary-fixed":"#d8e2ff","tertiary":"#7e2e00","error":"#ba1a1a","on-primary-container":"#cad9ff","background":"#f9f9fe"},"fontFamily":{"headline":["Plus Jakarta Sans"],"body":["Inter"],"mono":["JetBrains Mono"]},"borderRadius":{"lg":"18px","xl":"24px"}}}}</script>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}</style>
</head>
<body class="bg-background font-body text-on-surface antialiased">
<nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-xl flex justify-between items-center h-14 px-6 shadow-[0_8px_32px_0_rgba(26,28,31,0.04)]">
<div class="flex items-center gap-4">
  <a href="/admin" class="text-xl font-bold bg-gradient-to-br from-blue-700 to-blue-500 bg-clip-text text-transparent font-headline">Vantage OS</a>
  <span class="text-on-surface-variant text-sm">/ <a href="/admin/drives" class="hover:text-primary">Drives</a> / Detail</span>
</div>
<button id="logout-btn" class="p-2 text-slate-500 hover:bg-slate-100/50 rounded-full"><span class="material-symbols-outlined">logout</span></button>
</nav>
<main class="max-w-5xl mx-auto pt-20 px-6 pb-12">
  <a href="/admin/drives" class="inline-flex items-center gap-2 text-primary font-semibold mb-6 hover:underline"><span class="material-symbols-outlined text-base">arrow_back</span> Back to Drives</a>
  <div id="drive-content">
    <!-- Drive Header -->
    <div class="bg-surface-container-lowest p-8 rounded-2xl shadow-sm mb-6">
      <div class="flex items-start justify-between mb-4">
        <div><h1 id="drive-title" class="text-3xl font-extrabold font-headline mb-1">Loading...</h1><p id="role-title" class="text-lg text-on-surface-variant"></p></div>
        <div class="flex items-center gap-3">
          <span id="ctc-badge" class="font-mono font-bold text-primary bg-primary-fixed/20 px-4 py-2 rounded-full"></span>
          <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"></span>
        </div>
      </div>
      <div class="flex gap-4 text-sm text-on-surface-variant mb-4">
        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">location_on</span><span id="location">—</span></span>
        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">schedule</span><span id="deadline">—</span></span>
      </div>
      <!-- Status Control -->
      <div class="flex items-center gap-4 mt-4 pt-4 border-t border-outline-variant/30">
        <label class="text-sm font-semibold">Status:</label>
        <select id="status-select" class="bg-surface-container-high rounded-xl px-4 py-2 text-sm border-none focus:ring-2 focus:ring-primary/20">
          <option value="DRAFT">Draft</option><option value="OPEN">Open</option><option value="CLOSED">Closed</option>
        </select>
        <button id="btn-update-status" class="px-4 py-2 bg-primary text-white rounded-xl text-sm font-semibold hover:opacity-90">Update</button>
        <a id="btn-applicants" href="javascript:void(0)" class="ml-auto px-6 py-2 bg-secondary-container text-secondary rounded-xl text-sm font-semibold hover:opacity-90 inline-flex items-center gap-2">
          <span class="material-symbols-outlined text-base">group</span> Manage Applicants
        </a>
      </div>
    </div>
    <!-- Eligibility Rule -->
    <div class="bg-surface-container-lowest p-6 rounded-2xl shadow-sm mb-6">
      <h2 class="font-headline font-bold text-lg mb-4">Eligibility Rule</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div><label class="text-xs font-bold text-on-surface-variant uppercase">Min CGPA</label><input id="rule-min-cgpa" type="number" step="0.1" class="w-full bg-surface-container-high rounded-xl px-3 py-2 border-none mt-1"/></div>
        <div><label class="text-xs font-bold text-on-surface-variant uppercase">Max Backlogs</label><input id="rule-max-backlogs" type="number" class="w-full bg-surface-container-high rounded-xl px-3 py-2 border-none mt-1"/></div>
        <div class="flex items-end gap-2"><label class="flex items-center gap-2 text-sm"><input id="rule-verified" type="checkbox" class="rounded"/><span>Requires Verified</span></label></div>
        <div class="flex items-end"><button id="btn-save-rule" class="px-4 py-2 bg-primary text-white rounded-xl text-sm font-semibold">Save Rule</button></div>
      </div>
    </div>
    <!-- Eligible students preview -->
    <div class="bg-surface-container-lowest p-6 rounded-2xl shadow-sm mb-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-headline font-bold text-lg">Eligible Students Preview</h2>
        <span id="eligible-count" class="text-sm text-on-surface-variant"></span>
      </div>
      <div id="eligible-preview-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
    </div>
  </div>
</main>
<script src="/static/js/vantage-api.js?v=2"></script>
<script>
if (!requireAuth("admin")) {}
document.getElementById("logout-btn")?.addEventListener("click", doLogout);
const driveId = window.location.pathname.split("/").pop();

async function loadDrive() {
    const d = await apiFetch(`/api/admin/drives/${driveId}`);
    if (!d) { document.getElementById("drive-content").innerHTML='<p class="text-center py-20 text-on-surface-variant">Drive not found.</p>'; return; }
    document.getElementById("drive-title").textContent = d.drive_title || d.company_name;
    document.getElementById("role-title").textContent = d.role_title;
    document.getElementById("ctc-badge").textContent = d.ctc_lpa ? `₹${d.ctc_lpa} LPA` : '';
    document.getElementById("location").textContent = d.job_location || 'TBD';
    document.getElementById("deadline").textContent = d.application_close_at ? new Date(d.application_close_at).toLocaleDateString() : 'Open';

    const sb = document.getElementById("status-badge");
    const colors = { DRAFT:'bg-slate-100 text-slate-600', OPEN:'bg-green-100 text-green-700', CLOSED:'bg-red-100 text-red-600' };
    sb.className = `px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${colors[d.status]||''}`;
    sb.textContent = d.status;
    document.getElementById("status-select").value = d.status;
    document.getElementById("btn-applicants").href = `/admin/drives/${driveId}/applicants`;

    if (d.eligibility_rule) {
        document.getElementById("rule-min-cgpa").value = d.eligibility_rule.min_cgpa || 0;
        document.getElementById("rule-max-backlogs").value = d.eligibility_rule.max_backlogs || 0;
        document.getElementById("rule-verified").checked = d.eligibility_rule.requires_verified || false;
    }
    loadEligiblePreview();
}

async function loadEligiblePreview() {
    const data = await apiFetch(`/api/admin/drives/${driveId}/eligible-students`);
    if (!data) return;
    document.getElementById("eligible-count").textContent = `${data.count || 0} students eligible`;
    const list = document.getElementById("eligible-preview-list");
    list.innerHTML = '';
    (data.students || []).forEach(s => {
        list.innerHTML += `<div class="flex justify-between items-center px-4 py-2 bg-surface-container-low rounded-xl text-sm"><span class="font-mono">${s.roll_number}</span><span>${s.branch||''}</span><span>CGPA: ${s.cgpa}</span></div>`;
    });
}

document.getElementById("btn-update-status").addEventListener("click", async () => {
    const newStatus = document.getElementById("status-select").value;
    const res = await apiFetch(`/api/admin/drives/${driveId}`, { method: "PATCH", body: JSON.stringify({ status: newStatus }) });
    if (res) { showToast(`Drive status → ${newStatus}`, "success"); loadDrive(); }
});

document.getElementById("btn-save-rule").addEventListener("click", async () => {
    const rule = {
        min_cgpa: parseFloat(document.getElementById("rule-min-cgpa").value),
        max_backlogs: parseInt(document.getElementById("rule-max-backlogs").value),
        requires_verified: document.getElementById("rule-verified").checked
    };
    const res = await apiFetch(`/api/admin/drives/${driveId}/eligibility-rule`, { method: "POST", body: JSON.stringify(rule) });
    if (res) { showToast("Eligibility rule saved.", "success"); loadEligiblePreview(); }
});

document.addEventListener("DOMContentLoaded", loadDrive);
</script>
</body></html>
