<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Set New Password | Vantage OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
<style>body { font-family: 'Inter', sans-serif; background: #f9f9fe; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
  <div class="mb-8 text-center">
    <div class="w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-900" style="font-family:'Plus Jakarta Sans',sans-serif">Set Your Password</h1>
    <p class="text-sm text-slate-500 mt-2">Your account was created by the placement cell.<br/>Please set a personal password to continue.</p>
  </div>

  <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm"></div>

  <div class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Current Password</label>
      <p class="text-xs text-slate-400 mb-2">Your temporary password is your roll number (e.g. 21261A0501)</p>
      <input id="current-pw" type="password" placeholder="Current / temporary password"
        class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">New Password</label>
      <input id="new-pw" type="password" placeholder="At least 8 characters"
        class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Confirm New Password</label>
      <input id="confirm-pw" type="password" placeholder="Repeat new password"
        class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <button id="submit-btn"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors mt-2">
      Set Password & Continue
    </button>
  </div>
</div>

<script src="/static/js/vantage-api.js?v=2"></script>
<script>
if (!authToken) { window.location.href = "/login"; }

document.getElementById("submit-btn").addEventListener("click", async () => {
  const errEl = document.getElementById("error-msg");
  errEl.classList.add("hidden");

  const current = document.getElementById("current-pw").value;
  const newPw   = document.getElementById("new-pw").value;
  const confirm = document.getElementById("confirm-pw").value;

  if (!current || !newPw || !confirm) {
    errEl.textContent = "All fields are required."; errEl.classList.remove("hidden"); return;
  }
  if (newPw !== confirm) {
    errEl.textContent = "New passwords do not match."; errEl.classList.remove("hidden"); return;
  }
  if (newPw.length < 8) {
    errEl.textContent = "Password must be at least 8 characters."; errEl.classList.remove("hidden"); return;
  }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true; btn.textContent = "Saving…";

  const data = await apiFetch("/api/auth/change-password", {
    method: "POST",
    body: JSON.stringify({ current_password: current, new_password: newPw })
  });

  btn.disabled = false; btn.textContent = "Set Password & Continue";

  if (data) {
    showToast("Password set successfully!", "success");
    const role = authRole;
    const redirectMap = { student: "/student", admin: "/admin", recruiter: "/recruiter" };
    setTimeout(() => { window.location.href = redirectMap[role] || "/"; }, 1200);
  } else {
    errEl.textContent = "Failed to change password. Check your current password and try again.";
    errEl.classList.remove("hidden");
  }
});
</script>
</body>
</html>
